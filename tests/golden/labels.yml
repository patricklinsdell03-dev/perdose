# Golden label set (brief §15, Appendix B). TEST INPUTS ONLY — never shown on the site.
# Titles g01–g30 are Appendix B's; g31–g37 are synthetic extras so every compound has >= 3.
# Prices are synthetic test numbers (only g01's £14.99 comes from the brief's worked example).
#
# Per label:
#   compounds   which compounds this label counts towards (the ">= 3 per compound" rule)
#   extraction  the reference reading of the label (what a correct LLM extraction looks like).
#               Calc-only mode (Phase 1) feeds this to the rules + calculator. In Phase 2 the
#               live LLM output replaces it and is judged against the same `expect`.
#   expect      fields that must match. Tolerance ±1 % on numbers.
version: 1
labels:

  - id: g01
    compounds: [magnesium]
    title: "Magnesium Bisglycinate 2000mg (providing 200mg elemental magnesium) 180 Capsules — 2 capsules per serving"
    price_gbp: 14.99
    extraction:
      actives:
        - compound_id: magnesium
          form_raw: Bisglycinate
          form_id: bisglycinate
          amount_per_serving: 200
          amount_unit: mg
          amount_refers_to: elemental
          components: [{ name: compound_mass, amount: 2000, unit: mg }]
          evidence: { amount_per_serving: "providing 200mg elemental magnesium", compound_mass: "2000mg" }
      is_single_ingredient: true
      pack_units: 180
      pack_unit_type: capsule
      units_per_serving: 2
      confidence: 0.95
      evidence: { pack_units: "180 Capsules", units_per_serving: "2 capsules per serving" }
    expect:
      compound: magnesium
      form: bisglycinate
      form_class: mg_glycinate
      servings: 90
      amount: 200
      basis: stated_elemental
      needs_review: false
      price_per_std_dose: 0.08328
      cost_per_month: 2.498

