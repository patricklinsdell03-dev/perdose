# The rules table (brief §6, Appendix A). Prototype: 10 compounds.
# Factors are elemental mass fractions; every non-null factor is recomputed from its chemical
# formula by tests/test_factors.py using config/factor_sources.yml. Labels that state the
# elemental amount always win over a factor.
# Do NOT change a compound or form id once products exist (CLAUDE.md rule 7).
version: 1
compounds:

  - id: magnesium
    name: Magnesium
    category: minerals
    tier: 1
    comparison_quantity: elemental magnesium
    unit: mg
    standard_dose: 100
    label_convention: ambiguous
    normalisation_type: mineral_elemental
    aliases: [magnesium, mag, mg glycinate, mag glycinate, magnesium bisglycinate, magnesium citrate, magnesium malate, magnesium taurate, magnesium threonate, magtein, magnesium oxide, magnesium chloride]
    accepted_cofactors: [vitamin b6, pyridoxine, p5p]
    heuristics:
      # Brief §9.5 step 3: what an unqualified number most likely means.
      unclear_amount:
        compound_if_at_least: 400   # no single serving delivers >= 400 mg elemental in these forms
        compound_forms: [bisglycinate, citrate, malate, taurate, l_threonate]
        elemental_if_at_most: 120
    classes:   # comparison tables: label shown on the site, slug used in the URL
      mg_glycinate: { label: "Bisglycinate (glycinate)", slug: bisglycinate }
      mg_citrate: { label: "Citrate", slug: citrate }
      mg_malate: { label: "Malate", slug: malate }
      mg_taurate: { label: "Taurate", slug: taurate }
      mg_threonate: { label: "L-threonate", slug: l-threonate }
      mg_oxide: { label: "Oxide", slug: oxide }
      mg_chloride: { label: "Chloride", slug: chloride }
      mg_other: { label: "Blends and other forms", slug: other }
    forms:
      - id: bisglycinate
        names: [bisglycinate, glycinate, diglycinate, chelate, buffered chelate]
        class: mg_glycinate
        elemental_factor: 0.117
        note: "Magnesium bisglycinate dihydrate, 11.7% Mg — real labels state 11–11.25%; the anhydrous figure (14.1%) flattered compound-only labels. 'Buffered' chelates include oxide and run higher — treat as unclear if 'buffered' and no elemental stated."
      - id: citrate
        names: [citrate]
        class: mg_citrate
        elemental_factor: 0.16
        note: "Trimagnesium dicitrate anhydrous ~16%; hydrated/dimagnesium forms 11–15%. Prefer stated elemental."
      - id: malate
        names: [malate, di-magnesium malate, dimagnesium malate]
        class: mg_malate
        elemental_factor: 0.155
        note: "Anhydrous 1:1 magnesium malate 15.5%. Trihydrate is ~11.6% and dimagnesium malate ~19%, so estimates here are rough. Prefer stated elemental."
      - id: taurate
        names: [taurate, taurinate]
        class: mg_taurate
        elemental_factor: 0.089
      - id: l_threonate
        names: [l-threonate, threonate, magtein]
        class: mg_threonate
        elemental_factor: 0.083
      - id: oxide
        names: [oxide]
        class: mg_oxide
        elemental_factor: 0.603
      - id: chloride
        names: [chloride]
        class: mg_chloride
        elemental_factor: 0.12
        note: "Hexahydrate ~12%."
      - id: other
        names: [orotate, lactate, aspartate, carbonate, sulfate, sulphate, blend, complex, unspecified]
        class: mg_other
        elemental_factor: null
        note: "No factor -> requires stated elemental or needs_review."

