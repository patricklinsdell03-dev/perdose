# One entry per retailer (brief §7.3). Only retailers we hold real data for.
# Seed phase: data/seed/<id>.csv. Feed details (url_env, column_map) arrive in Phase 6.
# Shipping rules as shown on each retailer's site on 2026-09-17; not used in ranking (§10).
version: 1
retailers:
  - id: bulk
    name: Bulk
    enabled: true
    feed: { type: seed_csv }
    link: { template: "{url}" }
    shipping: { rule: free_over, threshold_gbp: 49, flat_gbp: 3.95 }
    notes: "Near-permanent sitewide promotions; seed prices are the promoted price. Effective price is v1.1."

  - id: myprotein
    name: Myprotein
    enabled: true
    feed: { type: seed_csv }
    link: { template: "{url}" }
    shipping: { rule: free_over, threshold_gbp: 55 }
    notes: "Near-permanent sitewide promotions. Sells Myvitamins and some third-party brands."

  - id: holland_barrett
    name: Holland & Barrett
    enabled: true
    feed: { type: seed_csv }
    link: { template: "{url}" }
    shipping: { rule: free_over, threshold_gbp: 30 }
    notes: "No barcodes on product pages. Hosts marketplace sellers ('Sold by ...') alongside own brand."

  - id: optimum_nutrition
    name: Optimum Nutrition
    enabled: true
    # Awin advertiser id 19863. Shares the one Awin feed (AWIN_FEED_URL) with every other
    # Awin retailer; each entry keeps only its own advertiser's rows.
    feed: { type: awin_google_csv, url_env: AWIN_FEED_URL, gzip: true, advertiser_id: "19863" }
    link: { template: "{url}" }   # Awin feeds supply tracked links (aw_deep_link)
    shipping: { rule: unknown }
    notes: "First live Awin feed (programme joined 2026-09-18). Own-brand sports nutrition. Feed priced in EUR on 2026-09-18, so nothing is kept until the advertiser supplies GBP."

  - id: healthspan
    name: Healthspan
    enabled: true
    feed: { type: seed_csv }
    link: { template: "{url}" }
    shipping: { rule: free_over, threshold_gbp: 30 }
    notes: "Own brand only (Healthspan, Healthspan Elite). No barcodes or product codes on pages. On 2026-09-17 a 'free delivery on all orders this week' promotion was running; the standing rule shown is free over £30, and the under-£30 charge was not displayed. Seed prices are one-time-purchase prices, never subscription prices."
