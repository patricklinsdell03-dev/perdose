# DRAFT — NOT LIVE. Batch 3 of the registry expansion (brief §17 Phase 6b, Appendix F).
# Nothing here reaches the site until Patrick approves it and the entries are moved into
# config/compounds.yml (see docs/RUNBOOK.md, "Approving a drafted batch").
#
# Botanicals whose comparison dose is the extract/powder mass (extract_standardised, as
# ashwagandha), plus nootropics and a few general-health simple-mass ingredients. Standard
# doses are Appendix F's comparison units — never recommendations. Still left out because
# they need new code: curcumin, green tea, milk thistle and cranberry (dose = a constituent's
# mg, not the extract mass), vitamins A/E (per-form IU), choline/carnitine (factors), beetroot.
version: 1
compounds:

  - id: rhodiola
    name: Rhodiola rosea
    category: botanicals
    tier: 1
    comparison_quantity: root extract
    unit: mg
    standard_dose: 400
    label_convention: compound_default
    normalisation_type: extract_standardised
    standardisation_component: rosavins
    aliases: [rhodiola, rhodiola rosea, golden root, arctic root]
    accepted_cofactors: []
    classes:
      rho_std: { label: "Standardised extract (3% rosavins)", slug: rhodiola }
      rho_unstd: { label: "Unstandardised / root powder", slug: rhodiola-powder }
    forms:
      - { id: standardised, names: [standardised, standardized, extract, 3% rosavins, rosavins, unspecified], class: rho_std, note: "3% rosavins / 1% salidroside is the trade standard; the % is stored as a component." }
      - { id: powder, names: [root powder, powder, whole root, unstandardised], class: rho_unstd }

