  - id: choline
    name: Choline
    category: vitamins
    tier: 2
    comparison_quantity: choline
    unit: mg
    standard_dose: 250
    label_convention: ambiguous
    normalisation_type: mineral_elemental
    aliases: [choline, choline bitartrate, choline chloride, phosphatidylcholine]
    accepted_cofactors: [inositol]
    heuristics:
      # "Choline bitartrate 500mg" is the salt; "Choline 250mg" is choline.
      unclear_amount:
        compound_if_at_least: 0
        compound_forms: [bitartrate, other]
        elemental_if_at_most: 100000
    classes:
      cho_bitartrate: { label: "Choline bitartrate", slug: choline-bitartrate }
      cho_other: { label: "Other forms", slug: choline-other }
    forms:
      - { id: choline, names: [choline, unspecified], class: cho_other, elemental_factor: 1.0, note: "A plain 'choline' figure is choline itself." }
      - { id: bitartrate, names: [bitartrate, choline bitartrate], class: cho_bitartrate, elemental_factor: 0.411 }
      - { id: other, names: [chloride, phosphatidylcholine, lecithin, choline chloride], class: cho_other, note: "No factor: needs the choline amount stated. Alpha-GPC and citicoline are their own compounds." }

