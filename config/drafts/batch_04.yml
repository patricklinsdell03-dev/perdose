# DRAFT — NOT LIVE. Batch 4 of the registry expansion (brief §17 Phase 6b, Appendix F).
# Nothing here reaches the site until Patrick approves it and the entries are moved into
# config/compounds.yml (see docs/RUNBOOK.md, "Approving a drafted batch").
#
# The batch that needed small rule additions: compounds compared on a stated constituent
# (curcuminoids, EGCG, silymarin, cranberry PACs — `constituent_required`), vitamins A and E
# with ONE IU conversion each (Patrick, 2026-09-18: no per-form conversion; forms still get
# their own tables), choline and carnitine with formula-checked factors, MCT oil as an
# oil_components compound. Standard doses are Appendix F's comparison units, never
# recommendations. Still left out: collagen/colostrum (per-gram type), probiotics (CFU),
# electrolytes/multivitamins (per-serving), beetroot nitrate, silica (expect review),
# lithium orotate, sodium bicarbonate (tier 3 sport).
version: 1
compounds:

  - id: vitamin_a
    name: Vitamin A
    category: vitamins
    tier: 2
    comparison_quantity: vitamin A
    unit: mcg
    standard_dose: 800
    unit_conversions: { mcg_to_IU: 3.333 }   # retinol: 1 IU = 0.3 mcg; the one conversion used for every form
    label_convention: elemental_default
    normalisation_type: vitamin_unit
    aliases: [vitamin a, retinol, retinyl palmitate, retinyl acetate, beta-carotene, beta carotene, betacarotene]
    accepted_cofactors: [vitamin d3, vitamin d]
    classes:
      va_retinol: { label: "Retinol (palmitate / acetate)", slug: retinol }
      va_carotene: { label: "Beta-carotene", slug: beta-carotene }
    forms:
      - { id: retinol, names: [retinol, retinyl palmitate, retinyl acetate, palmitate, acetate, unspecified], class: va_retinol }
      - { id: beta_carotene, names: [beta-carotene, beta carotene, betacarotene, mixed carotenoids], class: va_carotene, note: "Labels state beta-carotene mg or mcg; not converted to retinol equivalents (Patrick 2026-09-18)." }

  - id: vitamin_e
    name: Vitamin E
    category: vitamins
    tier: 2
    comparison_quantity: vitamin E
    unit: mg
    standard_dose: 268
    unit_conversions: { mcg_to_IU: 0.00149 }   # d-alpha: 1 mg = 1.49 IU; the one conversion used for every form
    label_convention: elemental_default
    normalisation_type: vitamin_unit
    aliases: [vitamin e, d-alpha tocopherol, dl-alpha tocopherol, tocopherol, tocopherols, tocotrienols, alpha-te]
    accepted_cofactors: [selenium, vitamin c]
    classes:
      ve_natural: { label: "Natural (d-alpha)", slug: d-alpha }
      ve_synthetic: { label: "Synthetic (dl-alpha)", slug: dl-alpha }
      ve_mixed: { label: "Mixed tocopherols / tocotrienols", slug: mixed-tocopherols }
    forms:
      - { id: d_alpha, names: [d-alpha, d-alpha tocopherol, d-alpha tocopheryl, natural, unspecified], class: ve_natural }
      - { id: dl_alpha, names: [dl-alpha, dl-alpha tocopherol, dl-alpha tocopheryl, synthetic], class: ve_synthetic }
      - { id: mixed, names: [mixed tocopherols, tocotrienols, full spectrum, gamma tocopherol], class: ve_mixed }

