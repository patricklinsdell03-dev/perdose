# DRAFT — NOT LIVE. Batch 1 of the registry expansion (brief §17 Phase 6b, Appendix F).
# Nothing here reaches the site until Patrick approves it and the entries are moved into
# config/compounds.yml (see docs/RUNBOOK.md, "Approving a drafted batch").
#
# Chosen because the existing normalisation types cover them with no new code. Standard doses
# are Appendix F's comparison units — never recommendations. Left out of this batch on purpose:
# citrulline (the brief's ~66 % factor for 2:1 malate does not match the chemistry, 72 %),
# choline and carnitine (factor questions), vitamins A and E (IU conversions differ by form).
version: 1
compounds:

  - id: vitamin_b6
    name: Vitamin B6
    category: vitamins
    tier: 1
    comparison_quantity: vitamin B6
    unit: mg
    standard_dose: 50
    label_convention: elemental_default
    normalisation_type: simple_mass
    aliases: [vitamin b6, b6, pyridoxine, pyridoxal-5-phosphate, pyridoxal 5 phosphate, p5p, p-5-p]
    accepted_cofactors: [magnesium, zinc]
    classes:
      b6_pyridoxine: { label: "Pyridoxine HCl", slug: pyridoxine }
      b6_p5p: { label: "P-5-P (active form)", slug: p5p }
    forms:
      - { id: pyridoxine_hcl, names: [pyridoxine, pyridoxine hcl, pyridoxine hydrochloride, unspecified], class: b6_pyridoxine }
      - { id: p5p, names: [p5p, p-5-p, pyridoxal-5-phosphate, pyridoxal 5 phosphate], class: b6_p5p }

