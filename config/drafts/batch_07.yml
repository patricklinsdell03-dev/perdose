# HELD only (batch 07's other 8 compounds were approved and merged into
# config/compounds.yml on 2026-09-19; see docs/DECISIONS.md).
version: 1
compounds:
  - id: uridine
    name: Uridine monophosphate
    category: nootropics
    tier: 3
    comparison_quantity: uridine monophosphate
    unit: mg
    standard_dose: 250
    label_convention: compound_default
    normalisation_type: simple_mass
    aliases: [uridine, uridine monophosphate, ump, triacetyluridine, tau]
    accepted_cofactors: [choline, alpha gpc, alpha-gpc, citicoline, fish oil, omega 3, omega-3]
    classes:
      urd: { label: "Uridine monophosphate", slug: uridine }
    forms:
      - { id: ump, names: [monophosphate, ump, triacetyluridine, tau, unspecified], class: urd, note: "UK sale status checked separately against FSA sources before this batch is merged (brief instruction). Often sold alongside choline/alpha-GPC/citicoline/fish oil in a 'Nootropic Stack' style product; those are listed as accepted cofactors so a straightforward uridine + choline-source product is not needlessly flagged as a combination." }

  - id: dmae
    name: DMAE
    category: nootropics
    tier: 3
    comparison_quantity: DMAE (as labelled)
    unit: mg
    standard_dose: 250
    label_convention: compound_default
    normalisation_type: simple_mass
    aliases: [dmae, dimethylaminoethanol, dmae bitartrate, deanol]
    accepted_cofactors: []
    classes:
      dmae: { label: "DMAE", slug: dmae }
    forms:
      - { id: dmae, names: [bitartrate, dmae bitartrate, deanol, unspecified], class: dmae, note: "Appendix F flags that labels vary between the DMAE base and the (heavier) bitartrate salt mass. Brief F.7 classes this simple_mass, not mineral_elemental, so there is no factor to convert between them — the stated figure is used as given, the same treated-as-stated philosophy already documented on the live lysine/tryptophan entries (a labelled salt's stated mass is the dose, not converted). This does not fully satisfy Appendix F's 'review if unclear' — the simple_mass resolver has no ambiguous-salt heuristic the way mineral_elemental does — flagging as a known limitation rather than inventing a new one-off code path. UK sale status checked separately against FSA sources before this batch is merged (brief instruction)." }
