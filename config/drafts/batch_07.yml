# DRAFT — NOT LIVE. Batch 7 of the registry expansion (brief §17 Phase 6b, Appendix F).
# Nothing here reaches the site until Patrick approves it and the entries are moved into
# config/compounds.yml (see docs/RUNBOOK.md, "Approving a drafted batch").
#
# A mushroom, two more adaptogenic/ginseng-family herbs, three fibres, a cofactor sold alone,
# and two nootropics. All use existing normalisation types — no new type needed. Standard
# doses are Appendix F's comparison units — never recommendations. Label ids in the golden
# file start with "m".
#
# One live-file edit is needed at merge time (not in this draft, since it touches an existing
# compound, not a new one): config/compounds.yml `panax_ginseng` needs `alias_exclusions:
# [american ginseng, panax quinquefolius]` added — its aliases already include bare "ginseng",
# which would otherwise also match the new american_ginseng compound's listings.
version: 1
compounds:

  - id: chaga
    name: Chaga
    category: botanicals
    tier: 3
    comparison_quantity: mushroom extract or powder
    unit: mg
    standard_dose: 1000
    label_convention: compound_default
    normalisation_type: extract_standardised
    standardisation_component: beta-glucans
    aliases: [chaga, inonotus obliquus]
    accepted_cofactors: []
    classes:
      cha_fruit: { label: "Fruiting body extract", slug: fruiting-body }
      cha_mycelium: { label: "Mycelium", slug: mycelium }
      cha_powder: { label: "Whole mushroom powder", slug: powder }
    forms:
      - { id: fruiting_body, names: [fruiting body, fruiting body extract, fruit body, extract], class: cha_fruit, note: "Same three-class pattern as lion's mane/reishi/cordyceps (brief F.6). `standardisation_component: beta-glucans` is set for consistency but, like those three, has no practical effect on the dose: a percentage-standardised component (the near-universal real-world case, e.g. '30% beta-glucans') is not picked up by the constituent resolver, which ignores percent-unit components; only a separately stated absolute beta-glucan mg figure would override the extract mass, and no real chaga label does that. The extract/powder mass is the dose either way." }
      - { id: mycelium, names: [mycelium, mycelia, mycelial biomass], class: cha_mycelium }
      - { id: powder, names: [powder, mushroom powder, whole mushroom, chunks, chaga chunks], class: cha_powder }

  - id: american_ginseng
    name: American ginseng
    category: botanicals
    tier: 3
    comparison_quantity: root extract
    unit: mg
    standard_dose: 200
    label_convention: compound_default
    normalisation_type: extract_standardised
    standardisation_component: ginsenosides
    aliases: [american ginseng, panax quinquefolius, quinquefolius]
    accepted_cofactors: []
    classes:
      ag_extract: { label: "Root extract", slug: american-ginseng }
      ag_powder: { label: "Root powder", slug: american-ginseng-powder }
    forms:
      - { id: extract, names: [extract, standardised, 5% ginsenosides, unspecified], class: ag_extract, note: "A different species from Panax ginseng (brief F.6) — deliberately not aliased with bare 'ginseng', so a plain 'Ginseng' listing continues to default to the existing panax_ginseng compound rather than becoming ambiguous between the two. See the live-file edit note at the top of this file — panax_ginseng needs an alias_exclusions entry so it is never offered as a candidate for American ginseng listings." }
      - { id: powder, names: [root powder, powder, whole root], class: ag_powder }

  - id: glucomannan
    name: Glucomannan
    category: botanicals
    tier: 3
    comparison_quantity: glucomannan
    unit: mg
    standard_dose: 1000
    label_convention: compound_default
    normalisation_type: simple_mass
    aliases: [glucomannan, konjac, konjac root, amorphophallus konjac]
    accepted_cofactors: []
    classes:
      glm: { label: "Glucomannan", slug: glucomannan }
    forms:
      - { id: glucomannan, names: [capsules, powder, unspecified], class: glm, note: "Dose = stated glucomannan mass (brief F.6); glucomannan capsules carry an FSA/EU-mandated choking-hazard warning (take with plenty of water) — a content matter for the site copy, not the pipeline." }

  - id: inulin
    name: Inulin / FOS
    category: botanicals
    tier: 3
    comparison_quantity: inulin / fructo-oligosaccharides
    unit: mg
    standard_dose: 5000
    label_convention: compound_default
    normalisation_type: simple_mass
    aliases: [inulin, fos, fructooligosaccharides, fructo-oligosaccharides, chicory root fibre, chicory root fiber, chicory inulin]
    accepted_cofactors: []
    classes:
      inl: { label: "Inulin / FOS", slug: inulin }
    forms:
      - { id: inulin, names: [powder, capsules, chicory root, unspecified], class: inl, note: "PHGG is a different fibre with its own id (fibre_phgg, this batch), not aliased here. Inulin is a very common bulking/prebiotic filler in unrelated products (probiotics, protein bars, bars) at an unstated trace amount — the existing filler-skip rule (no stated amount, not the title subject) already drops those rather than treating them as an active; tested in the golden set below." }

  - id: fibre_phgg
    name: PHGG
    category: general-health
    tier: 3
    comparison_quantity: partially hydrolysed guar gum
    unit: mg
    standard_dose: 5000
    label_convention: compound_default
    normalisation_type: simple_mass
    aliases: [phgg, partially hydrolysed guar gum, partially hydrolyzed guar gum, sunfiber, guar gum fibre]
    accepted_cofactors: []
    classes:
      phgg: { label: "PHGG", slug: phgg }
    forms:
      - { id: phgg, names: [powder, sunfiber, capsules, unspecified], class: phgg }

  - id: sea_moss
    name: Sea moss
    category: botanicals
    tier: 3
    comparison_quantity: sea moss (Irish moss)
    unit: mg
    standard_dose: 1000
    label_convention: compound_default
    normalisation_type: simple_mass
    aliases: [sea moss, irish moss, chondrus crispus, sea moss gel, wildcrafted sea moss]
    accepted_cofactors: []
    classes:
      sm: { label: "Sea moss", slug: sea-moss }
    forms:
      - { id: sea_moss, names: [powder, capsules, raw, gel, unspecified], class: sm, note: "Gel products are sold by the jar in ml with no per-capsule mg figure and are excluded from ranking (brief F.6/F.11) — they are aliased so they are correctly identified as sea moss rather than missed entirely, but with no stated per-serving mg amount they go to review by the normal rule rather than needing special-case code." }

  - id: black_pepper
    name: Black pepper (piperine)
    category: botanicals
    tier: 3
    comparison_quantity: piperine
    unit: mg
    standard_dose: 5
    label_convention: compound_default
    normalisation_type: extract_standardised
    standardisation_component: piperine
    aliases: [black pepper, piperine, bioperine, piper nigrum]
    accepted_cofactors: []
    classes:
      bp: { label: "Black pepper extract (piperine)", slug: black-pepper }
    forms:
      - { id: extract, names: [bioperine, extract, 95% piperine, standardised, unspecified], class: bp, note: "Real UK labels almost always state the branded/standardised extract mass directly as the dose (e.g. 'BioPerine 5mg') rather than breaking out a separate piperine sub-figure, so constituent_required is not set — a separately stated piperine mg figure still overrides the headline mass when given. Ashwagandha and curcumin already accept black pepper/piperine/BioPerine as a cofactor (brief Appendix A/F.6), so those combo products stay single-ingredient for ashwagandha/curcumin's own ranking; they will now ALSO get their own row in this new black_pepper table at their (usually very small, ~5mg) piperine dose, the same way B6 already appears in its own table inside magnesium+B6 combos. Appendix F's 'ranked only when sold alone' is not currently enforced anywhere in the rules engine — no compound gets suppressed from its own table just because it is more often a cofactor elsewhere — flagging this as a real gap between the brief's wording and what the architecture does today rather than building new filtering logic without asking." }

  - id: beta_glucan
    name: Beta-glucan
    category: general-health
    tier: 3
    comparison_quantity: beta-glucan
    unit: mg
    standard_dose: 250
    label_convention: compound_default
    normalisation_type: simple_mass
    aliases: [beta-glucan, beta glucan, beta-glucans, wellmune]
    accepted_cofactors: []
    classes:
      bg_oat: { label: "Oat beta-glucan", slug: oat-beta-glucan }
      bg_yeast: { label: "Yeast beta-glucan (1,3/1,6)", slug: yeast-beta-glucan }
    forms:
      - { id: oat, names: [oat, oat beta-glucan, oat bran, unspecified], class: bg_oat }
      - { id: yeast, names: [yeast, yeast beta-glucan, "1,3/1,6", "1,3-1,6", wellmune], class: bg_yeast, note: "Wellmune is a branded yeast (1,3/1,6) beta-glucan." }

  - id: uridine
    name: Uridine monophosphate
    category: nootropics
    tier: 3
    comparison_quantity: uridine monophosphate
    unit: mg
    standard_dose: 250
    label_convention: compound_default
    normalisation_type: simple_mass
    aliases: [uridine, uridine monophosphate, ump, triacetyluridine, tau]
    accepted_cofactors: [choline, alpha gpc, alpha-gpc, citicoline, fish oil, omega 3, omega-3]
    classes:
      urd: { label: "Uridine monophosphate", slug: uridine }
    forms:
      - { id: ump, names: [monophosphate, ump, triacetyluridine, tau, unspecified], class: urd, note: "UK sale status checked separately against FSA sources before this batch is merged (brief instruction). Often sold alongside choline/alpha-GPC/citicoline/fish oil in a 'Nootropic Stack' style product; those are listed as accepted cofactors so a straightforward uridine + choline-source product is not needlessly flagged as a combination." }

  - id: dmae
    name: DMAE
    category: nootropics
    tier: 3
    comparison_quantity: DMAE (as labelled)
    unit: mg
    standard_dose: 250
    label_convention: compound_default
    normalisation_type: simple_mass
    aliases: [dmae, dimethylaminoethanol, dmae bitartrate, deanol]
    accepted_cofactors: []
    classes:
      dmae: { label: "DMAE", slug: dmae }
    forms:
      - { id: dmae, names: [bitartrate, dmae bitartrate, deanol, unspecified], class: dmae, note: "Appendix F flags that labels vary between the DMAE base and the (heavier) bitartrate salt mass. Brief F.7 classes this simple_mass, not mineral_elemental, so there is no factor to convert between them — the stated figure is used as given, the same treated-as-stated philosophy already documented on the live lysine/tryptophan entries (a labelled salt's stated mass is the dose, not converted). This does not fully satisfy Appendix F's 'review if unclear' — the simple_mass resolver has no ambiguous-salt heuristic the way mineral_elemental does — flagging as a known limitation rather than inventing a new one-off code path. UK sale status checked separately against FSA sources before this batch is merged (brief instruction)." }
