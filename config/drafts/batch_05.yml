# HELD — kanna only (batch 5's other 19 compounds were approved and merged into
# config/compounds.yml on 2026-09-19; see docs/DECISIONS.md).
#
# kanna (Sceletium tortuosum) is held: unresolved doubt on GB Novel Food status (no
# clear pre-1997 EU food-use history) and, separately, whether the Psychoactive
# Substances Act 2016's exemptions clearly cover it. Not one of the five compounds
# checked against the FSA/EU Novel Food Status Catalogue this run (docs/DECISIONS.md
# 2026-09-19) -- that covered agmatine/DMAE/uridine/NMN/lithium orotate only -- so this
# is its own, lower-confidence hold, not a guess either way. Resolve with an explicit
# Novel Food / PSA 2016 check before ever merging.
version: 1
compounds:
  - id: kanna
    name: Kanna (Sceletium)
    category: botanicals
    tier: 3
    comparison_quantity: kanna extract
    unit: mg
    standard_dose: 25
    label_convention: compound_default
    normalisation_type: extract_standardised
    standardisation_component: alkaloids
    aliases: [kanna, sceletium tortuosum, sceletium, zembrin]
    accepted_cofactors: []
    classes:
      kan_generic: { label: "Kanna extract", slug: kanna }
      kan_zembrin: { label: "Zembrin", slug: zembrin }
    forms:
      - { id: generic, names: [extract, powder, unspecified], class: kan_generic }
      - { id: zembrin, names: [zembrin], class: kan_zembrin }
