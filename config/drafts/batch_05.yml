# DRAFT — NOT LIVE. Batch 5 of the registry expansion (brief §17 Phase 6b, Appendix F).
# Nothing here reaches the site until Patrick approves it and the entries are moved into
# config/compounds.yml (see docs/RUNBOOK.md, "Approving a drafted batch").
#
# First half of the tier-2/3 long tail: calming herbs, men's-health herbs, fibre and algae,
# a few amino-acid derivatives. All use existing rules. Standard doses are Appendix F's
# comparison units — never recommendations. Label ids in the golden file start with "j".
version: 1
compounds:

  - id: echinacea
    name: Echinacea
    category: botanicals
    tier: 3
    comparison_quantity: echinacea extract or herb
    unit: mg
    standard_dose: 400
    label_convention: compound_default
    normalisation_type: extract_standardised
    aliases: [echinacea, echinacea purpurea, echinacea angustifolia]
    accepted_cofactors: [vitamin c, zinc, elderberry]
    classes:
      ech: { label: "Echinacea", slug: echinacea }
    forms:
      - { id: echinacea, names: [extract, purpurea, angustifolia, root, herb, powder, unspecified], class: ech, note: "Purpurea and angustifolia share one class (brief F.6). THR-registered products are a label flag, not a class." }

