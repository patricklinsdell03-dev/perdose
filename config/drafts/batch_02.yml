# DRAFT — NOT LIVE. Batch 2 of the registry expansion (brief §17 Phase 6b, Appendix F).
# Nothing here reaches the site until Patrick approves it and the entries are moved into
# config/compounds.yml (see docs/RUNBOOK.md, "Approving a drafted batch").
#
# Chosen because the existing normalisation types cover them with no new code. Standard doses
# are Appendix F's comparison units — never recommendations. Citrulline uses the factors decided
# on 2026-09-18 (DECISIONS.md): 2:1 malate 0.723, 1:1 malate 0.566, ratio not stated → review.
# Still left out: vitamins A and E (IU conversions differ by form), choline and carnitine
# (factor questions), NMN (UK sale status to confirm), collagen (per-gram type).
version: 1
compounds:

  - id: vitamin_b1
    name: Thiamine (vitamin B1)
    category: vitamins
    tier: 2
    comparison_quantity: thiamine
    unit: mg
    standard_dose: 100
    label_convention: elemental_default
    normalisation_type: simple_mass
    aliases: [thiamine, thiamin, vitamin b1, benfotiamine]
    accepted_cofactors: []
    classes:
      b1_thiamine: { label: "Thiamine", slug: thiamine }
      b1_benfotiamine: { label: "Benfotiamine", slug: benfotiamine }
    forms:
      - { id: thiamine, names: [thiamine, thiamin, thiamine hcl, thiamine hydrochloride, thiamine mononitrate, unspecified], class: b1_thiamine }
      - { id: benfotiamine, names: [benfotiamine], class: b1_benfotiamine, note: "Fat-soluble derivative; labels state benfotiamine mg." }

