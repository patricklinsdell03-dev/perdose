  - id: citrulline
    name: L-Citrulline
    category: amino-acids
    tier: 1
    comparison_quantity: L-citrulline
    unit: mg
    standard_dose: 3000
    label_convention: ambiguous
    normalisation_type: mineral_elemental
    aliases: [citrulline, l-citrulline, citrulline malate]
    accepted_cofactors: []
    heuristics:
      # A number next to "citrulline malate" is the salt's mass; next to plain citrulline it is
      # the amino acid itself. Both are always true in practice, so both heuristics are open-ended.
      unclear_amount:
        compound_if_at_least: 0
        compound_forms: [malate_2_1, malate_1_1, malate_unknown]
        elemental_if_at_most: 100000
    classes:
      cit_base: { label: "L-Citrulline (pure)", slug: l-citrulline }
      cit_malate: { label: "Citrulline malate", slug: citrulline-malate }
    forms:
      - { id: base, names: [l-citrulline, citrulline, pure, base, unspecified], class: cit_base, elemental_factor: 1.0, note: "The amino acid itself: factor 1, so a stated mass is used as-is, never labelled an estimate." }
      - { id: malate_2_1, names: ["malate 2:1", "citrulline malate 2:1", "2:1"], class: cit_malate, elemental_factor: 0.723, note: "2 citrulline : 1 malic acid by formula." }
      - { id: malate_1_1, names: ["malate 1:1", "citrulline malate 1:1", "1:1"], class: cit_malate, elemental_factor: 0.566, note: "1:1 by formula." }
      - { id: malate_unknown, names: [malate, citrulline malate], class: cit_malate, note: "Ratio not stated: cannot estimate citrulline content → review." }

