# Ingest filter (brief §7.4). A listing is kept only if it mentions a compound alias AND
# none of these terms appears in its title. They catch things that share a compound's name
# but are out of scope: topical products, protein (F.11). Multivitamins are in scope since
# 2026-09-18 (per_serving comparison).
version: 1
exclude_title_terms:
  - bath flakes
  - bath salts
  - epsom
  - oil spray
  - body butter
  - body lotion
  - whey
  - protein powder
  - mass gainer
