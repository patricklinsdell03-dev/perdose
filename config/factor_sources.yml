# Where every elemental factor in compounds.yml comes from (brief §21.1).
# Method: factor = (count x atomic weight of the element) / molecular weight of the formula,
# using IUPAC abridged standard atomic weights (https://iupac.qmul.ac.uk/AtWt/).
# tests/test_factors.py recomputes each entry and fails if compounds.yml drifts by > 1.5 %.
# NIH ODS fact sheets could not be machine-read on 2026-09-17 (HTTP 403), so they are not cited.
version: 1
atomic_weights_source: "IUPAC abridged standard atomic weights, https://iupac.qmul.ac.uk/AtWt/"
checked_on: 2026-09-17
