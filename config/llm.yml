# LLM settings for the normaliser (brief §9.2).
# PATRICK CHOOSES THE MODELS (docs/DECISIONS.md 2026-09-17): Sonnet 5 for everything.
# Id checked against https://docs.claude.com on 2026-09-17.
#
# With a single model, "escalation" means a second attempt at a higher thinking effort,
# not a bigger model. Sonnet 5 does not accept a temperature setting, so there is none.
models:
  default:
    id: claude-sonnet-5
    effort: low
  escalation:
    id: claude-sonnet-5
    effort: high
max_tokens: 8000
escalation_confidence_threshold: 0.7
prompt_version: "1.1.0"
max_calls_per_run: 5000
description_max_chars: 3000

# Learn-page drafting (`make content`, brief §20.3): two calls per page (read the studies,
# write the draft). Same model as everything else. "high" is the API's default thinking effort.
content:
  id: claude-sonnet-5
  effort: high

# For the cost line `make content` prints and its spending cap (config/content.yml).
# US dollars per million tokens, from Anthropic's published prices (checked 2026-09-18).
pricing_usd_per_mtok:
  claude-sonnet-5: { input: 2.00, output: 10.00 }
gbp_per_usd: 0.75   # approximate; estimates only
