[project]
name = "pipeline"
version = "0.0.0"
description = "UK supplement price comparison pipeline: ingest -> normalise -> price -> export"
requires-python = ">=3.12,<3.13"
dependencies = [
    "anthropic",
    "httpx",
    "pydantic>=2",
    "pyyaml",
    "tzdata",
]

[dependency-groups]
dev = [
    "pytest",
    "ruff",
]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["site", "docs", "content"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"pipeline/db.py" = ["E501"] # the SQL schema is kept verbatim from the brief

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
