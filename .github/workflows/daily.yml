name: daily

# Daily refresh (brief §14): ingest -> read new listings -> price -> export -> build, then
# commit the refreshed data. Cloudflare Pages deploys from main when the commit lands.
#
# The cron is OFF until live feeds exist (Phase 6): seed CSVs do not change by themselves, so
# a daily run would do nothing. To switch it on, uncomment the two `schedule` lines.
# API cost: only new or changed listings are sent to the model; an unchanged day costs nothing.
on:
  workflow_dispatch:
  # schedule:
  #   - cron: "10 5 * * *" # 06:10 BST / 05:10 GMT

permissions:
  contents: write

concurrency:
  group: daily
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      TZ: Europe/London
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: make setup

      # The database is not in git. Bring back yesterday's so cached AI readings and product
      # ids carry over; without it every listing would be re-read (and paid for) daily.
      - name: Restore the database
        uses: actions/cache/restore@v4
        with:
          path: data/perdose.sqlite
          key: perdose-sqlite-${{ github.run_id }}
          restore-keys: perdose-sqlite-

      - name: Remember the previous counts
        run: cp data/export/meta.json /tmp/meta.before.json 2>/dev/null || true

      - run: make all

      - name: Regression guard - block the deploy if a table lost all its products
        run: uv run python -m pipeline.cli guard --before /tmp/meta.before.json

      - name: Save the database for tomorrow
        uses: actions/cache/save@v4
        with:
          path: data/perdose.sqlite
          key: perdose-sqlite-${{ github.run_id }}

      - name: Back up the database (30 days)
        uses: actions/upload-artifact@v4
        with:
          name: perdose-sqlite-${{ github.run_id }}
          path: data/perdose.sqlite
          retention-days: 30

      - name: Commit refreshed export data if it changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/export
          git diff --cached --quiet && echo "No data changes." && exit 0
          git commit -m "data: refresh $(date +%F)"
          git push
